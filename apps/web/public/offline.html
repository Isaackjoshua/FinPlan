<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f6b4f" />
    <title>Offline · FinPlan</title>
    <!-- Shown by the service worker when a page cannot be reached. Self-contained:
         when offline, nothing else can be fetched. Holds no user data. -->
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        background: #f6f8f6;
        color: #17201c;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main { max-width: 26rem; }
      p.brand { margin: 0; font-size: 0.875rem; font-weight: 600; color: #0f6b4f; }
      h1 { margin: 0.5rem 0 0; font-size: 1.75rem; font-weight: 600; }
      p.lead { margin: 0.75rem 0 0; color: #5d6a64; line-height: 1.5; }
      a {
        display: inline-block;
        margin-top: 1.5rem;
        padding: 0.5rem 1rem;
        border-radius: 0.5rem;
        background: #0f6b4f;
        color: #fff;
        font-size: 0.875rem;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">FinPlan</p>
      <h1>You're offline</h1>
      <p class="lead">
        FinPlan needs a connection to show your plan. Your data is kept on the server, not on this
        device, so nothing is lost. Try again once you're back online.
      </p>
      <a href="javascript:location.reload()">Try again</a>
    </main>
  </body>
</html>
