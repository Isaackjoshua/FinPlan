# Local development services. Credentials here are for development only.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: finplan
      POSTGRES_PASSWORD: finplan_dev
      POSTGRES_DB: finplan
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finplan -d finplan"]
      interval: 2s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  pgdata:
