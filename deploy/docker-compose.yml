# Production stack for a single server. Run from the repo root:
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
# Only Caddy is reachable from outside (ports 80 and 443). Postgres and the apps
# are on a private network. Caddy serves the website at DOMAIN and the MCP
# endpoint for AI apps at mcp.DOMAIN.
name: finplan

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: finplan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: finplan
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finplan -d finplan"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: { context: .., target: migrate }
    environment:
      DATABASE_URL: postgres://finplan:${POSTGRES_PASSWORD}@postgres:5432/finplan
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  web:
    build: { context: .., target: web }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://finplan:${POSTGRES_PASSWORD}@postgres:5432/finplan
      DATA_MASTER_KEY: ${DATA_MASTER_KEY:?set DATA_MASTER_KEY in deploy/.env}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in deploy/.env}
      BETTER_AUTH_URL: https://${DOMAIN:?set DOMAIN in deploy/.env}
      SMTP_URL: ${SMTP_URL:?set SMTP_URL in deploy/.env}
      EMAIL_FROM: ${EMAIL_FROM:?set EMAIL_FROM in deploy/.env}
      AUTH_INTERNAL_URL: http://auth:3002
      AUTH_INTERNAL_SECRET: ${AUTH_INTERNAL_SECRET:?set AUTH_INTERNAL_SECRET in deploy/.env}
    depends_on:
      migrate: { condition: service_completed_successfully }

  # OAuth server for AI app connections. Reached only through the web app.
  auth:
    build: { context: .., target: services }
    working_dir: /repo/apps/auth
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://finplan:${POSTGRES_PASSWORD}@postgres:5432/finplan
      BETTER_AUTH_URL: https://${DOMAIN}
      MCP_URL: https://mcp.${DOMAIN}/mcp
      AUTH_INTERNAL_SECRET: ${AUTH_INTERNAL_SECRET}
      AUTH_HOST: 0.0.0.0
      AUTH_PORT: 3002
    depends_on:
      migrate: { condition: service_completed_successfully }

  # The endpoint AI apps connect to.
  mcp:
    build: { context: .., target: services }
    working_dir: /repo/apps/mcp
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://finplan:${POSTGRES_PASSWORD}@postgres:5432/finplan
      DATA_MASTER_KEY: ${DATA_MASTER_KEY}
      BETTER_AUTH_URL: https://${DOMAIN}
      MCP_URL: https://mcp.${DOMAIN}/mcp
      # Hostnames of web pages allowed to call the endpoint from a browser. Empty: none.
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
      MCP_HOST: 0.0.0.0
      MCP_PORT: 3001
    depends_on:
      migrate: { condition: service_completed_successfully }

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - web
      - mcp

volumes:
  pgdata:
  caddy_data:
